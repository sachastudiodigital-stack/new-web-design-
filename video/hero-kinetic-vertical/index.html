<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap-3.14.2.min.js"></script>
    <style>
      @font-face {
        font-family: "Lexend Giga";
        src: url("assets/fonts/LexendGiga-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Sora";
        src: url("assets/fonts/Sora-latin.woff2") format("woff2");
        font-weight: 100 800;
      }
      :root {
        --ink: #0a0e14;
        --paper: #f5f5f5;
        --blue: #1a8cff;
        --muted: #8a94a6;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background-color: var(--ink);
        background-image: radial-gradient(rgba(245, 245, 245, 0.07) 1.5px, transparent 1.5px);
        background-size: 48px 48px;
        font-family: "Lexend Giga", sans-serif;
        color: var(--paper);
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .word {
        display: block;
        font-weight: 600;
        text-transform: uppercase;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .sub {
        display: block;
        font-weight: 300;
        text-transform: uppercase;
        line-height: 1;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .blue {
        color: var(--blue);
      }
      .muted {
        color: var(--muted);
      }
      .letters span {
        display: inline-block;
      }
      .slice {
        background: var(--blue);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 8% 100%);
      }
      .label {
        font-family: "Sora", sans-serif;
        font-weight: 400;
        font-size: 34px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .label .tab {
        width: 52px;
        height: 22px;
        background: var(--blue);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 30% 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="11"
      data-width="1080"
      data-height="1920"
    >
      <!-- 1. Attention isn't enough -->
      <section id="s1" class="clip" data-start="0" data-duration="1.9" data-track-index="0">
        <div id="s1-wrap" style="position: relative">
          <span id="s1-a" class="word" style="font-size: 112px">Attention</span>
          <div id="s1-strike" class="slice" data-layout-allow-occlusion style="position: absolute; left: -3%; right: -3%; top: 44%; height: 18px"></div>
        </div>
        <div id="s1-b" style="margin-top: 56px">
          <span class="sub muted" style="font-size: 96px">isn't</span>
          <span class="sub muted" style="font-size: 96px; margin-top: 24px">enough.</span>
        </div>
      </section>

      <!-- 2. You need systems -->
      <section id="s2" class="clip" data-start="1.9" data-duration="1.6" data-track-index="0">
        <span id="s2-a" class="sub" style="font-size: 84px; margin-bottom: 44px">You need</span>
        <span id="s2-b" class="word blue letters" style="font-size: 126px"
          ><span>S</span><span>Y</span><span>S</span><span>T</span><span>E</span><span>M</span><span>S</span><span>.</span></span
        >
      </section>

      <!-- 3. What we build, rapid fire -->
      <section id="s3" class="clip" data-start="3.5" data-duration="2.8" data-track-index="0">
        <div id="s3-label" class="label" style="position: absolute; top: 560px">
          <span class="tab"></span><span>What we build</span>
        </div>
        <div id="s3-words" data-layout-allow-overlap style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
          <div id="s3-1" style="position: absolute"><span class="word" style="font-size: 200px">AI</span><span class="word" style="font-size: 160px; margin-top: 20px">agents</span></div>
          <div id="s3-2" style="position: absolute"><span class="word" style="font-size: 124px">WhatsApp</span><span class="word blue" style="font-size: 200px; margin-top: 20px">CRMs</span></div>
          <div id="s3-3" style="position: absolute"><span class="word" style="font-size: 170px">Auto-</span><span class="word" style="font-size: 140px; margin-top: 20px">mations</span></div>
          <div id="s3-4" style="position: absolute"><span class="word" style="font-size: 156px">Custom</span><span class="word" style="font-size: 120px; margin-top: 20px">software</span></div>
        </div>
        <div id="s3-count" class="label" style="position: absolute; bottom: 560px; letter-spacing: 0.3em">
          <span style="position: relative; display: inline-block"><span id="s3-n1">01</span><span id="s3-n2" style="position: absolute; left: 0; opacity: 0">02</span><span id="s3-n3" style="position: absolute; left: 0; opacity: 0">03</span><span id="s3-n4" style="position: absolute; left: 0; opacity: 0">04</span></span><span>/ 04</span>
        </div>
      </section>

      <!-- 4. For every growing business -->
      <section id="s4" class="clip" data-start="6.3" data-duration="1.9" data-track-index="0">
        <span id="s4-a" class="sub" style="font-size: 84px">For every</span>
        <span id="s4-b" class="word blue" style="font-size: 134px; margin: 44px 0">Growing</span>
        <span id="s4-c" class="word" style="font-size: 104px">business.</span>
      </section>

      <!-- 5. Logo sting -->
      <section id="s5" class="clip" data-start="8.2" data-duration="2.8" data-track-index="0">
        <div id="s5-bar" class="slice" style="position: absolute; right: 0; top: 520px; width: 62%; height: 96px"></div>
        <img id="s5-logo" src="assets/logo-light.png" alt="Sacha Tech" style="width: 820px; height: auto" />
        <div id="s5-tag" class="label" style="margin-top: 90px; flex-direction: column; gap: 22px; letter-spacing: 0.3em">
          <span>AI-powered systems</span><span>for every growing business</span>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const snap = "power4.out";
      const exit = "power3.in";

      // 1. ATTENTION stretches up from squashed, ISN'T ENOUGH slides in, blue slice strikes through
      tl.fromTo("#s1-a", { scaleY: 0.05, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.35, ease: snap }, 0.15);
      tl.fromTo("#s1-b", { x: -160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: snap }, 0.5);
      tl.fromTo("#s1-strike", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.3, ease: snap }, 1.05);
      tl.to("#s1-a", { opacity: 0.35, duration: 0.2 }, 1.1);
      tl.to("#s1", { x: -260, opacity: 0, duration: 0.2, ease: exit }, 1.7);

      // 2. YOU NEED slides from the right, SYSTEMS. letters snap up one by one
      tl.fromTo("#s2-a", { x: 220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: snap }, 1.95);
      tl.fromTo(
        "#s2-b span",
        { y: 160, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: snap, stagger: 0.04 },
        2.15
      );
      tl.to("#s2", { scale: 1.18, opacity: 0, duration: 0.2, ease: exit }, 3.3);

      // 3. Four services, about 0.7s each, each with a different entrance
      tl.fromTo("#s3-label", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: snap }, 3.5);
      tl.fromTo("#s3-count", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 3.55);
      tl.fromTo("#s3-1", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: snap }, 3.55);
      tl.to("#s3-1", { x: 300, opacity: 0, duration: 0.15, ease: exit }, 4.1);
      tl.fromTo("#s3-2", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: snap }, 4.25);
      tl.to("#s3-2", { y: -120, opacity: 0, duration: 0.15, ease: exit }, 4.8);
      tl.fromTo("#s3-3", { scaleY: 0.05, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.3, ease: snap }, 4.95);
      tl.to("#s3-3", { scale: 0.6, opacity: 0, duration: 0.15, ease: exit }, 5.5);
      tl.fromTo(
        "#s3-4 .word",
        { y: 140, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.28, ease: snap, stagger: 0.08 },
        5.6
      );
      tl.set("#s3-n1", { opacity: 0 }, 4.25);
      tl.set("#s3-n2", { opacity: 1 }, 4.25);
      tl.set("#s3-n2", { opacity: 0 }, 4.95);
      tl.set("#s3-n3", { opacity: 1 }, 4.95);
      tl.set("#s3-n3", { opacity: 0 }, 5.6);
      tl.set("#s3-n4", { opacity: 1 }, 5.6);
      tl.to("#s3", { x: -260, opacity: 0, duration: 0.2, ease: exit }, 6.1);

      // 4. FOR EVERY / GROWING / BUSINESS. slam in on the beat
      tl.fromTo("#s4-a", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: snap }, 6.35);
      tl.fromTo("#s4-b", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: snap }, 6.6);
      tl.fromTo("#s4-c", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: snap }, 6.85);
      tl.to("#s4", { y: -140, opacity: 0, duration: 0.2, ease: exit }, 8.0);

      // 5. The blue slice sweeps in, the logo lands, then everything fades back to the grid for a clean loop
      tl.fromTo("#s5-bar", { xPercent: 100 }, { xPercent: 0, duration: 0.5, ease: snap }, 8.2);
      tl.fromTo("#s5-logo", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: snap }, 8.45);
      tl.fromTo("#s5-tag", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: snap }, 8.85);
      tl.to("#s5", { opacity: 0, duration: 0.45, ease: "power2.in" }, 10.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
